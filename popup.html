<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 180px;
      padding: 10px;
      margin: 0;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      margin-top: 10px;
    }
    label:first-of-type {
      margin-top: 0;
    }
    select, input {
      width: 100%;
      padding: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    #totalSpeed {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <label for="speedSelect">Playback Speed:</label>
  <select id="speedSelect">
    <option value="1">1x (Normal)</option>
    <option value="2">2x</option>
    <option value="3" selected>3x</option>
    <option value="4">4x</option>
    <option value="5">5x</option>
    <option value="6">6x</option>
    <option value="7">7x</option>
  </select>

  <label for="speedAddon">Fine-tune (+0.0 to +0.9):</label>
  <input type="number" id="speedAddon" min="0.0" max="0.9" step="0.1" value="0">

  <div id="totalSpeed">Total: 3x</div>

  <script src="popup.js"></script>
</body>
</html>
